<text x="1244" y="384" font-size="22" fill="#f6e9cb" text-anchor="start" opacity="1">风险不清时撤离，收益明确时再交易</text>
<text x="1244" y="413" font-size="22" fill="#f6e9cb" text-anchor="start" opacity="1">或决斗。</text>
