  <!-- Right content: 20-line readable area -->
  <g>
    <path d="M422 143 L1160 143 L1174 157 L1158 627 L424 627 L410 613 L422 158 Z" fill="#d7d8d0" stroke="#09070a" stroke-width="5"/>
    <path d="M438 158 L1144 158 L1155 170 L1142 611 L439 611 L429 600 L438 171 Z" fill="#b6bab2" opacity="0.30"/>

    <g>
      <circle cx="468" cy="181" r="17" fill="#241018" stroke="#f4cc58" stroke-width="3"/>
      <image href="../../project/assets/generated/player_circle_avatar.png" x="451" y="164" width="34" height="34"/>
      <text x="498" y="187" class="name ink">灰狐代笔员</text>
      <text x="451" y="212" class="body ink">我们从哪一份债契开始？</text>
      <text x="451" y="233" class="body ink">我只关心谁在撒谎。</text>
      <text x="451" y="254" class="body ink">如果你愿意交换投票，我会先听你的条件。</text>
      <path d="M450 269 L1138 269" stroke="#27191f" stroke-width="2" opacity="0.18"/>
    </g>

    <g>
      <circle cx="468" cy="293" r="17" fill="#241018" stroke="#f4cc58" stroke-width="3"/>
      <image href="../../project/assets/generated/npc_fox_circle_avatar.png" x="451" y="276" width="34" height="34"/>
      <text x="498" y="299" class="name ink">绯尾侯爵</text>
      <text x="451" y="324" class="body ink">你问债契，就像问谁的尾巴先碰到了火盆。</text>
      <text x="451" y="345" class="body ink">我可以支持“金条关照案”有罪，但你得保证不提旧仓库。</text>
      <text x="451" y="366" class="body ink">议会里没有干净的人，只有擦得更亮的靴子。</text>
      <path d="M450 381 L1138 381" stroke="#27191f" stroke-width="2" opacity="0.18"/>
    </g>

    <g>
      <circle cx="468" cy="405" r="17" fill="#130d10" stroke="#e87555" stroke-width="3"/>
      <image href="../../project/assets/generated/npc_crow_circle_avatar.png" x="451" y="388" width="34" height="34"/>
      <text x="498" y="411" class="name ink">议会事件：墨羽补录</text>
      <text x="451" y="436" class="body ink">墨羽书记官公开记录：绯尾侯爵倾向支持“金条关照案”有罪。</text>
      <text x="451" y="457" class="body ink">两名旁听员要求把这条倾向写入本回合记录。</text>
      <path d="M450 472 L1138 472" stroke="#27191f" stroke-width="2" opacity="0.18"/>
    </g>

    <g>
      <circle cx="468" cy="496" r="17" fill="#241018" stroke="#f4cc58" stroke-width="3"/>
      <image href="../../project/assets/generated/player_circle_avatar.png" x="451" y="479" width="34" height="34"/>
      <text x="498" y="502" class="name ink">灰狐代笔员</text>
      <text x="451" y="527" class="body ink">那我们先把火盆搬到桌面上。</text>
      <text x="451" y="548" class="body ink">你保护旧仓库，我要你在清算时站到明处。</text>
      <path d="M450 563 L1138 563" stroke="#27191f" stroke-width="2" opacity="0.18"/>
    </g>

    <g>
      <circle cx="468" cy="587" r="17" fill="#241018" stroke="#f4cc58" stroke-width="3"/>
      <image href="../../project/assets/generated/npc_fox_circle_avatar.png" x="451" y="570" width="34" height="34"/>
      <text x="498" y="593" class="name ink">绯尾侯爵</text>
      <text x="451" y="612" class="body ink">成交，但别把承诺说得像誓言，誓言最容易被书记官听见。</text>
    </g>

