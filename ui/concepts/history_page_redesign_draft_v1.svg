      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#050306" flood-opacity="0.55"/>
    </filter>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .heavy { font-weight: 900; }
      .title { font-size: 34px; }
      .round { font-size: 22px; }
      .leftName { font-size: 17px; font-weight: 900; }
      .leftSmall { font-size: 12px; }
      .name { font-size: 17px; font-weight: 900; }
      .body { font-size: 16px; }
      .gold { fill: #ffd866; }
      .cream { fill: #fff0c6; }
      .muted { fill: #d5c6aa; }
      .ink { fill: #1a1118; }
    </style>
  </defs>

  <image href="../../project/assets/ui/history/history_page_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
