      <path d="M42 86 L92 0 L138 94 Z M150 86 L242 0 L222 120 Z" fill="#2b2b31" stroke="#050405" stroke-width="7"/>
      <path d="M48 126 C90 50 232 48 278 142 C326 238 246 326 142 318 C52 304 8 214 48 126 Z" fill="#3a3d43" stroke="#050405" stroke-width="10" opacity=".72"/>
      <path d="M32 342 L288 342 L312 374 L288 462 L32 462 L8 374 Z" fill="#101013" stroke="#745225" stroke-width="4"/>
      <text x="66" y="384" class="body">灰狼密谈者</text>
      <text x="56" y="416" class="small">低亲近 / 可能掌握商店线索</text>
      <text x="96" y="446" class="small">情报优先</text>
    </g>

