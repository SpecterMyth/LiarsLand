      <path d="M64 112 L102 18 L140 124 Z M142 116 L232 26 L216 154 Z" fill="#e61a42" stroke="#050405" stroke-width="8"/>
      <path d="M46 152 C82 66 196 62 246 150 C294 238 238 330 134 332 C44 318 10 238 46 152 Z" fill="url(#red)" stroke="#050405" stroke-width="10"/>
