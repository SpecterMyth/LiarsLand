  <g filter="url(#shadow)" transform="translate(1482 142)">
    <g><rect width="64" height="64" rx="6" fill="#10100f" stroke="#ca8437" stroke-width="3"/><text x="21" y="31" class="buttonIcon">?</text><text x="15" y="52" class="buttonLabel">情报</text></g>
    <g transform="translate(0 78)"><rect width="64" height="64" rx="6" fill="#10100f" stroke="#ca8437" stroke-width="3"/><text x="20" y="31" class="buttonIcon">包</text><text x="15" y="52" class="buttonLabel">背包</text></g>
    <g transform="translate(0 156)"><rect width="64" height="64" rx="6" fill="#10100f" stroke="#ca8437" stroke-width="3"/><text x="20" y="31" class="buttonIcon">史</text><text x="15" y="52" class="buttonLabel">历史</text></g>
    <g transform="translate(0 234)"><rect width="64" height="64" rx="6" fill="#10100f" stroke="#ca8437" stroke-width="3"/><text x="20" y="31" class="buttonIcon">法</text><text x="15" y="52" class="buttonLabel">规则</text></g>
    <g transform="translate(0 312)"><rect width="64" height="64" rx="6" fill="#10100f" stroke="#ca8437" stroke-width="3"/><text x="20" y="31" class="buttonIcon">态</text><text x="15" y="52" class="buttonLabel">状态</text></g>
    <g transform="translate(0 390)"><rect width="64" height="64" rx="6" fill="#10100f" stroke="#ca8437" stroke-width="3"/><text x="20" y="31" class="buttonIcon">设</text><text x="15" y="52" class="buttonLabel">设置</text></g>
