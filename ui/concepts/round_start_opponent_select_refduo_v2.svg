  <g transform="translate(132 812)">
    <path d="M0 0 L1288 0 L1330 34 L1288 66 L0 66 L-42 34 Z" fill="#090708" stroke="url(#gold)" stroke-width="3"/>
    <text x="32" y="42" class="body">玩家信息只跟随红狐头像，下方框统一承载能量、等级、统治进度、背包和行为文件摘要；右侧保留对话页同款方形工具列。</text>
  </g>
