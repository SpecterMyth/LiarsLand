    <style>
      .title{font:700 42px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#ffe4a0}
      .sub{font:500 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#d8d1c3}
      .cardTitle{font:700 24px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#120807}
      .body{font:500 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#f5ead1}
      .small{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#cdbb8b}
      .buttonIcon{font:800 24px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#ffe4a0}
      .buttonLabel{font:700 13px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#f8d98c}
      .frame{fill:#080708;stroke:url(#gold);stroke-width:4}
